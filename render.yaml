services:
  # EviLock FastAPI Backend Service
  - type: web
    name: evilock-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: evilock-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: STORAGE_LOCAL_PATH
        value: /tmp/evilock_vault

  # EviLock React Vite Frontend
  - type: web
    name: evilock-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: evilock-backend
          property: host
          path: /api

databases:
  # Global Managed PostgreSQL Database
  - name: evilock-postgres
    region: oregon
    plan: free
    databaseName: evilock_db
    user: evilock_user
