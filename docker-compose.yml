services:
  db:
    image: postgres:16-alpine
    container_name: evilock_postgres
    restart: always
    environment:
      POSTGRES_USER: evilock_user
      POSTGRES_PASSWORD: evilock_secure_password_2026
      POSTGRES_DB: evilock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evilock_user -d evilock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evilock_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://evilock_user:evilock_secure_password_2026@db:5432/evilock_db
      SECRET_KEY: ${SECRET_KEY:-evilock-super-secure-cryptographic-signing-key-2026}
      STORAGE_LOCAL_PATH: /app/storage/vault
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - vault_data:/app/storage/vault

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evilock_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  vault_data:
